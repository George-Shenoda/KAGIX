name: kagix_smart_home
description: >-
  Kagix Smart Home mobile controller app for MCT 331s Mechatronic System
  Integration (Ain Shams University). Uses native Android Bluetooth Classic SPP
  (HC-05 / HC-06) with zero legacy Gradle plugins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
