name: Build Kagix Production Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate clean AGP 9 Android project & inject Kagix files + App Icons
        run: |
          cp lib/main.dart /tmp/main.dart
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          fi
          if [ -f android/app/src/main/kotlin/com/kagix/kagix_smart_home/MainActivity.kt ]; then
            cp android/app/src/main/kotlin/com/kagix/kagix_smart_home/MainActivity.kt /tmp/MainActivity.kt
          fi
          if [ -d android/app/src/main/res ]; then
            cp -r android/app/src/main/res /tmp/kagix_res
          fi
          rm -rf android pubspec.lock
          flutter create --project-name kagix_smart_home --org com.kagix .
          cp /tmp/main.dart lib/main.dart
          if [ -f /tmp/AndroidManifest.xml ]; then
            sed 's/package="com.kagix.smarthome"//g' /tmp/AndroidManifest.xml > android/app/src/main/AndroidManifest.xml
          fi
          if [ -f /tmp/MainActivity.kt ]; then
            mkdir -p android/app/src/main/kotlin/com/kagix/kagix_smart_home
            cp /tmp/MainActivity.kt android/app/src/main/kotlin/com/kagix/kagix_smart_home/MainActivity.kt
          fi
          if [ -d /tmp/kagix_res ]; then
            cp -r /tmp/kagix_res/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Kagix Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Kagix-Smart-Home-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-ipa:
    name: Build iOS Production App (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter on macOS
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate clean iOS project & inject Kagix files + App Icon
        run: |
          cp lib/main.dart /tmp/main.dart
          if [ -f ios/Runner/Info.plist ]; then
            cp ios/Runner/Info.plist /tmp/Info.plist
          fi
          rm -rf ios pubspec.lock
          flutter create --project-name kagix_smart_home --org com.kagix .
          cp /tmp/main.dart lib/main.dart
          if [ -f /tmp/Info.plist ]; then
            cp /tmp/Info.plist ios/Runner/Info.plist
          fi
          if [ -f assets/icon/app_icon.png ]; then
            cp assets/icon/app_icon.png ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png 2>/dev/null || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Kagix-Smart-Home-iOS.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Kagix-Smart-Home-iOS.ipa Payload

      - name: Upload Kagix Production iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kagix-Smart-Home-iOS-IPA
          path: Kagix-Smart-Home-iOS.ipa
