name: Build Kagix Production Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Production APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing platform scaffolding if needed
        run: flutter create --project-name kagix_smart_home --org com.kagix .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Kagix Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Kagix-Smart-Home-Android-APK
          path: build/app/outputs/flutter-apk/*.apk

  build-ios-ipa:
    name: Build iOS Production App (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter on macOS
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate iOS platform scaffolding if needed
        run: flutter create --project-name kagix_smart_home --org com.kagix .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into KagixSmartHome.ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Kagix-Smart-Home-iOS.ipa Payload

      - name: Upload Kagix Production iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Kagix-Smart-Home-iOS-IPA
          path: Kagix-Smart-Home-iOS.ipa
